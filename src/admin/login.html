<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="../assets/favicon-nb.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="../js/login.js" defer></script>
</head>
<body class="flexCenter">
    <main class="flexCenter">
        <div class="flexCenter text">
            <h1>Nanda</h1>
            <p>by Lash</p>
            <div class="line"></div>
            <h2>Faça login para acessar o seu painel.</h2>
        </div>
        <form class="flexCenter">
            <div class="input-box flexCenter">
                <i class="fa-solid fa-key"></i>
                <input type="text" name="id-user" id="id-user" placeholder="Digite seu ID">
            </div>
            <div class="input-box flexCenter">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="psw-user" id="psw-user" placeholder="Digite sua senha">
                <i class="fa-solid fa-eye" onclick="showPsw()"></i>
            </div>
            <button type="submit" onclick="login(event)">Entrar</button>
        </form>
    </main>
    <div class="bg-error">
        <div class="error flexCenter">
            <button type="button" onclick="closeError()">X</button>
            <p class="msg-error"></p>
        </div>
    </div>
</body>
</html>
